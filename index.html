<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Language Translator</h1>
        <p>Translate text from one language to another</p>

        <textarea id="inputText" placeholder="Enter your text here..."></textarea>

        <div class="language-box">
            <select id="sourceLanguage">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="ar">Arabic</option>
            </select>

            <select id="targetLanguage">
                <option value="ur">Urdu</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="ar">Arabic</option>
            </select>
        </div>

        <button id="translateBtn">Translate</button>
        <div class="extra-buttons">
    <button id="swapBtn">Swap Languages</button>
    <button id="copyBtn">Copy Translation</button>
</div>
<button id="clearBtn">Clear Text</button>

        <textarea id="outputText" placeholder="Translated text will appear here..." readonly></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
